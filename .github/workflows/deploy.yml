# Deploy Genesis to production.
#
# Two triggers, one job.
#
#   * `workflow_run` — every merge to `main`, but only once CI has gone green on
#     that exact commit. A `push` trigger would race CI and could put a red main
#     in front of users; `workflow_run` waits for the verdict and reads
#     `head_sha`, so the deploy is of the commit that was tested rather than of
#     whatever `main` points at by the time the runner starts.
#   * `workflow_dispatch` — the button. Redeploys, config changes that need no
#     commit, and a way back after a bad deploy. It does NOT wait for CI, because
#     the case it exists for is the one where you already know what you want.
#
# The merge itself is unattended (scripts/autopilot.sh squash-merges on a green
# local suite), so this is the gate that decides what production runs.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: What to deploy
        type: choice
        default: everything
        options:
          - everything
          - functions
          - hosting
          - firestore rules and indexes
      ref:
        description: Branch, tag or SHA (blank = main)
        type: string
        default: ''

# Serialised, and deliberately not cancelled mid-flight: `firebase deploy` is
# not atomic — it uploads a Hosting release and replaces Cloud Run revisions one
# by one — so a cancelled run can leave the two halves on different commits.
# Queueing the next deploy behind this one costs a few minutes; interrupting one
# costs a debugging session.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A `workflow_run` fires on *completion*, whatever the conclusion — so
    # without this, a failed CI run would deploy. Dispatch is unconditional.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          # The SHA CI actually verified, not the branch head. Empty on dispatch.
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${RUN_SHA:-${INPUT_REF:-main}}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying $ref"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            functions/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix functions ci

      # Ahead of the build, because the build's configuration comes from Secret
      # Manager now and this is what grants access to it. Writes the key to a
      # file and exports GOOGLE_APPLICATION_CREDENTIALS, which both gcloud and
      # firebase-tools read. The file lives on the runner and dies with it.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Read out of the repository rather than held in GitHub, because both are
      # already committed — `.firebaserc` names the project and `firebase.json`
      # names the Firestore database. A copy in a repository variable would be a
      # second source of truth for a value that already has one, and
      # functions/.env.example says outright that the database id "must match
      # `database` in firebase.json". Deriving it is how that stops being
      # something a human has to remember.
      - name: Resolve the project from the repository
        id: project
        run: |
          project=$(node -p "require('./.firebaserc').projects.default")
          database=$(node -p "require('./firebase.json').firestore.database")
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "project=$project database=$database"

      # The SPA's configuration, as the literal file, straight from Secret
      # Manager to disk.
      #
      # It never passes through a shell variable or an `env:` block, which is the
      # point: GitHub prints a step's `env:` block into the run log, and this
      # repository is public. The previous version of this step published every
      # value it wrote.
      #
      # To be clear about what this does and does not buy — **none of these
      # values is secret**. Vite compiles all of them into the bundle, which is
      # served to every visitor, so anyone can read them from the browser. What
      # changes is that configuration now has exactly one home instead of two,
      # and the deploy log is no longer one of the places it is published.
      #
      #   Contents: see frontend/.env.example
      #   Set it:   gcloud secrets versions add FRONTEND_ENV --data-file=frontend/.env
      - name: Fetch the SPA configuration
        env:
          PROJECT: ${{ steps.project.outputs.project }}
        run: |
          if ! gcloud secrets versions access latest \
                 --secret=FRONTEND_ENV --project="$PROJECT" > frontend/.env; then
            echo "::error::Could not read the FRONTEND_ENV secret. See scripts/setup-deploy.sh." >&2
            exit 1
          fi

          # Never the values — a count and the names, so a truncated or empty
          # secret is visible here rather than three steps later as a blank
          # Firebase config in the browser.
          echo "wrote frontend/.env with $(grep -c '^[A-Z]' frontend/.env) settings:"
          grep -oE '^[A-Z_]+' frontend/.env | sed 's/^/  /'

          if ! grep -q '^VITE_FIREBASE_PROJECT_ID=.' frontend/.env; then
            echo "::error::FRONTEND_ENV has no VITE_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi

      # One line, derived above. Everything else the functions need is a
      # `defineSecret` — the two credentials and the four configuration values
      # that used to live here — so there is nothing left for this file to carry
      # and nothing in it worth hiding.
      - name: Write functions/.env
        env:
          DATABASE: ${{ steps.project.outputs.database }}
        run: |
          echo "FIRESTORE_DATABASE_ID=$DATABASE" > functions/.env
          cat functions/.env

      - name: Build the SPA
        run: npm --prefix frontend run build

      # The same check CI runs, repeated here because this is the artefact that
      # actually ships. It is the only layer that can see a *transitive* pull of
      # the Firestore client SDK — the ESLint rule and the source scan both read
      # our own code, so neither would notice a dependency importing it for us.
      - name: No Firestore SDK in the bundle
        run: node scripts/check-no-firestore.mjs frontend/dist

      - name: Resolve deploy targets
        id: only
        env:
          CHOICE: ${{ inputs.targets }}
        run: |
          case "$CHOICE" in
            functions) only="functions" ;;
            hosting) only="hosting" ;;
            "firestore rules and indexes") only="firestore:rules,firestore:indexes" ;;
            # Both the `everything` choice and the automatic post-CI run.
            *) only="functions,hosting,firestore:rules,firestore:indexes" ;;
          esac
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "Deploying: $only"

      # `--force` so a function removed from source is removed from the project
      # rather than prompting; source is the only thing that decides what exists.
      # The functions predeploy hook in firebase.json compiles functions/src.
      - name: Deploy
        run: |
          npx firebase deploy \
            --only "${{ steps.only.outputs.only }}" \
            --project "${{ steps.project.outputs.project }}" \
            --non-interactive \
            --force \
            --message "${{ steps.target.outputs.ref }}"

      # A deploy that reports success has proven the upload, and nothing else.
      # /api/health writes a Firestore document, reads it back and deletes it —
      # so a 200 here proves the Hosting rewrite reaches the function, the
      # function booted, FIRESTORE_DATABASE_ID arrived, and the Admin SDK can
      # reach the named database. Every one of those has broken a deploy before.
      - name: Smoke test the deployed API
        if: ${{ steps.only.outputs.only != 'firestore:rules,firestore:indexes' }}
        env:
          SITE: https://${{ steps.project.outputs.project }}.web.app
        run: |
          echo "GET $SITE/api/health"

          # Retried: a fresh Cloud Run revision can take a few seconds to accept
          # its first request, and a cold start is not a failed deploy. The `if`
          # is doing real work — under `bash -e`, `body=$(curl) && break` leans on
          # the AND-list exemption to keep looping, which is a subtlety no one
          # should have to recall while reading a deploy gate.
          body=""
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 30 "$SITE/api/health"); then
              break
            fi
            body=""
            echo "attempt $attempt failed; retrying in 10s"
            sleep 10
          done

          if [ -z "$body" ]; then
            echo "::error::/api/health never answered. The deploy uploaded; the service did not come up." >&2
            exit 1
          fi

          echo "$body"

          # `jq -e` sets the exit status from the result, so a body that parses
          # but says ok:false fails here rather than being printed and ignored.
          if ! echo "$body" | jq -e '.ok == true' > /dev/null; then
            echo "::error::/api/health answered, but not with ok:true" >&2
            exit 1
          fi

          echo "$body" | jq -r '"round trip \(.roundTripMs)ms (write \(.writeMs)ms, read \(.readMs)ms)"'

      - name: Summary
        if: always()
        env:
          SITE: https://${{ steps.project.outputs.project }}.web.app
        run: |
          {
            echo "### Deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.target.outputs.ref }}\` |"
            echo "| Targets | \`${{ steps.only.outputs.only }}\` |"
            echo "| Project | \`${{ steps.project.outputs.project }}\` |"
            echo "| Site | $SITE |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
