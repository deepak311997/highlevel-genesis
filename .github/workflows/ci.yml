name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            functions/package-lock.json

      # The Firestore emulator is a Java process; rules tests fail without a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `npm ci`, not `npm install` — it installs exactly what the lockfiles
      # pin and fails if they disagree with package.json, so CI can't silently
      # resolve different versions than a developer got.
      - name: Install
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix functions ci

      # First, because it is seconds and it catches a class of error nothing else
      # here can see. A workflow is not compiled, not typechecked and not
      # imported by any test — it is parsed by GitHub at trigger time, so a
      # mistake in one is invisible until the run that needed it does not
      # happen. This step was added after a comment in deploy.yml containing a
      # literal empty expression made the whole file unparseable; every suite
      # below stayed green.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Firestore rules tests
        run: npm run test:rules

      # L4. Cloud Functions end to end against the auth, firestore and
      # functions emulators. Needs no secrets: config is passed inline by the
      # npm script, and SMTP2GO is never called — the emulator selects a
      # transport that records mail into Firestore instead.
      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # L5. Worth the minutes: this is the only test that exercises
      # /auth/action in the signed-in-and-unverified state, which is the one
      # combination whose misclassification makes verification unreachable.
      # Left out of CI it would only ever run on someone's laptop.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      # The third layer of the Firestore ban, and the only one that can see a
      # transitive pull: the ESLint rule and the frontend/src source scan both
      # read our own code, so neither would notice a dependency importing the
      # SDK on our behalf. Runs after Build because it reads the artefact.
      - name: No Firestore SDK in the bundle
        run: node scripts/check-no-firestore.mjs frontend/dist
