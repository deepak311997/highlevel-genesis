<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/genesis-mark.svg" />
    <meta name="theme-color" content="#2B4BF2" />
    <title>Genesis</title>
    <script>
      // Runs before first paint so the page never renders in the wrong theme
      // and then snaps. Deliberately duplicates the key and class name from
      // src/composables/useTheme.ts — an import here would be too late.
      ;(function () {
        try {
          var pref = localStorage.getItem('genesis:theme')
          var followSystem = pref !== 'light' && pref !== 'dark'
          var dark =
            pref === 'dark' ||
            (followSystem && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private browsing: fall through to the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
